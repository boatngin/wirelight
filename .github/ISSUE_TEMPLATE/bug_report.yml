name: Bug report
description: Something doesn't work as expected
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Never paste private keys or full configs.** Remove `PrivateKey` and `PresharedKey` lines first.
        Security problems go to [private reporting](https://github.com/boatngin/wirelight/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a config with …
        2. Turn on …
        3. …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wgbarctl doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Helper log
      description: "`log show --last 10m --predicate 'subsystem == \"com.thanaboat.wgbar\"'`"
      render: text
  - type: input
    id: version
    attributes:
      label: Wirelight version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.2, Apple M2"
    validations:
      required: true
