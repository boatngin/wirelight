name: Wirelight
options:
  bundleIdPrefix: io.github.boatngin
  deploymentTarget:
    macOS: "13.0"
packages:
  WGCore:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Wirelight:
    type: application
    platform: macOS
    sources: [Wirelight]
    dependencies:
      - package: WGCore
        product: WGCore
      - package: Sparkle
        product: Sparkle
    info:
      path: Wirelight/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Wirelight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: https://github.com/boatngin/wirelight/releases/latest/download/appcast.xml
        # Empty unless the release build passes SPARKLE_PUBLIC_KEY; the updater stays off without it.
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        NSLocationUsageDescription: Wirelight reads the name of the current Wi-Fi network to connect or disconnect tunnels automatically (on demand). The name is only used on this Mac and never leaves it.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boatngin.wirelight
        MARKETING_VERSION: "0.4.1" # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
