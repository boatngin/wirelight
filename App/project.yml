name: WGTail
options:
  bundleIdPrefix: com.thanaboat
  deploymentTarget:
    macOS: "13.0"
packages:
  WGCore:
    path: ..
targets:
  WGTail:
    type: application
    platform: macOS
    sources: [WGTail]
    dependencies:
      - package: WGCore
        product: WGCore
    info:
      path: WGTail/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: WGTail
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanaboat.wgbar
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Set your Personal Team ID here (or in Xcode > Signing). Empty = sign to run locally.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
