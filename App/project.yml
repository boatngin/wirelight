name: Wirelight
options:
  bundleIdPrefix: com.thanaboat
  deploymentTarget:
    macOS: "13.0"
packages:
  WGCore:
    path: ..
targets:
  Wirelight:
    type: application
    platform: macOS
    sources: [Wirelight]
    dependencies:
      - package: WGCore
        product: WGCore
    info:
      path: Wirelight/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Wirelight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanaboat.wgbar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
